<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GNP Hospital • Dashboard</title>
<style>
  body { background:#0b1120; color:#f8fafc; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
  .box { background:#111827; border:1px solid #334155; border-radius:14px; padding:28px 34px; box-shadow:0 20px 40px rgba(0,0,0,0.45); max-width:340px; }
  .spin { width:36px; height:36px; border:3px solid #334155; border-top-color:#06b6d4; border-radius:50%; animation:sp 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div style="font-weight:700;font-size:16px;margin-bottom:6px;">Connecting to GNP Hospital Dashboard...</div>
  <div id="st" style="font-size:12px;color:#94a3b8;">Redirecting automatically...</div>
</div>
<script>
(async () => {
  const qs = window.location.search || '?key=gnp2026';
  try {
    const r = await fetch('https://ntfy.sh/gnp_hosp_tunnel_dr_mohanad_2026/json?poll=1&since=48h', { cache: 'no-store' });
    const txt = await r.text();
    const lines = txt.trim().split('\n').filter(Boolean);
    for (let i = lines.length - 1; i >= 0; i--) {
      try {
        const obj = JSON.parse(lines[i]);
        if (obj.message && obj.message.startsWith('https://')) {
          const target = obj.message.trim().replace(/\/+$/, '') + '/' + (qs.startsWith('?') ? qs : ('?' + qs));
          window.location.replace(target);
          return;
        }
      } catch (_) {}
    }
  } catch (e) {}
  document.getElementById('st').textContent = 'Could not reach tunnel — verify bot is running.';
})();
</script>
</body>
</html>
